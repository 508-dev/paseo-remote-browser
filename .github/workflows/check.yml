name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --min-release-age=7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
